<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7FA874">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>技能学习台</title>
<style>
  :root{
    --green:#7FA874; --green-d:#4A7042; --green-l:#A7C49B; --green-bg:rgba(238,243,234,.55);
    --ink:#2A3326; --muted:#6F7A68; --line:rgba(255,255,255,.6);
    --ai:#6B8FD6; --ai-bg:rgba(234,238,248,.65);
    --shoot:#D69B5E; --shoot-bg:rgba(247,238,223,.65);
    --edit:#C97BA8; --edit-bg:rgba(245,230,239,.65);
    --we:#5E9DA8; --we-bg:rgba(226,238,241,.65);
    --hi:#D98C8C;
    --glass:rgba(255,255,255,.5);
    --blur:saturate(180%) blur(20px);
    --shadow:0 8px 32px rgba(80,100,70,.14);
    --shadow-sm:0 2px 12px rgba(80,100,70,.08);
    --inset:inset 0 1px 0 rgba(255,255,255,.75);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink); font-size:15px; line-height:1.5;
    background:
      radial-gradient(circle at 12% 16%, rgba(127,168,116,.45), transparent 38%),
      radial-gradient(circle at 88% 10%, rgba(107,143,214,.38), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(217,140,140,.32), transparent 44%),
      radial-gradient(circle at 15% 88%, rgba(93,157,168,.36), transparent 44%),
      radial-gradient(circle at 52% 52%, rgba(201,123,168,.16), transparent 55%),
      linear-gradient(135deg, #e9efe5 0%, #f4f7f0 100%);
    background-attachment: fixed;}
  button{font-family:inherit; cursor:pointer; border:none; background:none; color:inherit;}
  input,textarea,select{font-family:inherit; font-size:14px; color:var(--ink);}
  ::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:rgba(167,196,155,.55); border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{display:flex; min-height:100vh;}
  /* sidebar */
  #sidebar{width:220px; flex:0 0 220px; background:rgba(255,255,255,.45); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border-right:1px solid rgba(255,255,255,.55); box-shadow:var(--inset), 4px 0 24px rgba(80,100,70,.06);
    display:flex; flex-direction:column; padding:18px 12px; position:fixed; top:0; bottom:0; left:0; z-index:30; transition:transform .25s ease;}
  .brand{display:flex; align-items:center; gap:9px; padding:4px 8px 16px; font-weight:700; font-size:17px; color:var(--green-d);}
  .brand .logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6);box-shadow:var(--inset),0 2px 10px rgba(80,100,70,.08);display:flex;align-items:center;justify-content:center;color:var(--green-d);}
  .nav-item{display:flex; align-items:center; gap:11px; padding:11px 12px; border-radius:12px; color:var(--ink); margin-bottom:4px; font-size:15px; transition:all .18s; cursor:pointer; border:1px solid transparent;}
  .nav-item .ic{font-size:17px; width:22px; text-align:center;}
  .nav-item:hover{background:rgba(255,255,255,.5);}
  .nav-item.active{background:rgba(127,168,116,.85); color:#fff; box-shadow:0 4px 14px rgba(127,168,116,.4), var(--inset);}
  .nav-item .nav-dot{width:7px;height:7px;border-radius:50%; margin-left:auto;}
  .side-foot{margin-top:auto; padding-top:12px; border-top:1px solid rgba(255,255,255,.5);}
  .sync-mini{font-size:12px; color:var(--muted); padding:6px 10px; display:flex; justify-content:space-between; align-items:center;}
  .sync-dot{width:8px;height:8px;border-radius:50%; background:var(--muted);}
  .sync-dot.ok{background:var(--green); box-shadow:0 0 8px rgba(127,168,116,.6);} .sync-dot.err{background:var(--hi); box-shadow:0 0 8px rgba(217,140,140,.6);}

  #overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.22); backdrop-filter:blur(4px); z-index:25;}
  /* main */
  #main{flex:1; margin-left:220px; display:flex; flex-direction:column; min-width:0;}
  #topbar{position:sticky; top:0; z-index:20; background:rgba(255,255,255,.5); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid rgba(255,255,255,.55); box-shadow:0 2px 16px rgba(80,100,70,.05);
    padding:12px 20px; display:flex; align-items:center; gap:12px;}
  .hamburger{display:none; font-size:22px; padding:2px 6px;}
  .top-title{font-weight:700; font-size:16px;}
  .top-spacer{flex:1;}
  .top-date{font-size:13px; color:var(--muted);}
  .btn{padding:8px 14px; border-radius:11px; background:linear-gradient(135deg,var(--green),var(--green-d)); color:#fff; font-size:14px; font-weight:600; transition:transform .15s, box-shadow .15s; box-shadow:0 4px 12px rgba(127,168,116,.4);}
  .btn:hover{transform:translateY(-1px); box-shadow:0 6px 18px rgba(127,168,116,.5);}
  .btn.ghost{background:rgba(255,255,255,.55); color:var(--green-d); border:1px solid rgba(255,255,255,.7); box-shadow:var(--inset), 0 2px 8px rgba(80,100,70,.06);}
  .btn.ghost:hover{background:rgba(255,255,255,.75);}
  .btn.sm{padding:6px 11px; font-size:13px; border-radius:9px;}
  .btn.danger{background:rgba(255,255,255,.6); color:var(--hi); border:1px solid rgba(217,140,140,.5); box-shadow:var(--inset);}

  #content{padding:20px; max-width:1100px; width:100%; margin:0 auto;}

  /* cards (glass) */
  .card{background:var(--glass); backdrop-filter:var(--blur); -webkit-backdrop-filter:var(--blur); border:1px solid rgba(255,255,255,.6);
    border-radius:18px; padding:16px 18px; margin-bottom:16px; box-shadow:var(--shadow), var(--inset);}
  .card-h{font-weight:700; font-size:15px; margin-bottom:12px; display:flex; align-items:center; gap:8px;}
  .card-h .sub{font-weight:400; font-size:13px; color:var(--muted);}
  .card-h .right{margin-left:auto;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  .grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px;}
  @media(max-width:880px){ .grid4{grid-template-columns:1fr 1fr;} .grid2{grid-template-columns:1fr;} }

  /* home */
  .date-hero{font-size:13px; color:var(--muted);}
  .date-hero .big{font-size:30px; font-weight:800; background:linear-gradient(135deg,var(--green-d),var(--green));-webkit-background-clip:text;background-clip:text;color:transparent; display:block; margin-top:2px;}
  .quick{display:flex; flex-wrap:wrap; gap:10px;}
  .quick .q{padding:11px 15px; border-radius:12px; background:rgba(255,255,255,.5); color:var(--green-d); font-weight:600; font-size:14px; border:1px solid rgba(255,255,255,.6); cursor:pointer;}
  .quick .q:hover{background:rgba(255,255,255,.7);}
  .stat-num{font-size:26px; font-weight:800;}
  .stat-lbl{font-size:13px; color:var(--muted);}
  .ring{--p:0; width:64px;height:64px;border-radius:50%; background:conic-gradient(var(--green) calc(var(--p)*1%), rgba(255,255,255,.4) 0); display:flex; align-items:center; justify-content:center; margin:0 auto 8px;}
  .ring i{width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:13px;font-weight:700;color:var(--green-d);}
  .ring.ai{background:conic-gradient(var(--ai) calc(var(--p)*1%), rgba(255,255,255,.4) 0);}
  .ring.ai i{color:var(--ai);}
  .ring.shoot{background:conic-gradient(var(--shoot) calc(var(--p)*1%), rgba(255,255,255,.4) 0);}
  .ring.shoot i{color:var(--shoot);}
  .ring.edit{background:conic-gradient(var(--edit) calc(var(--p)*1%), rgba(255,255,255,.4) 0);}
  .ring.edit i{color:var(--edit);}
  .ring.we{background:conic-gradient(var(--we) calc(var(--p)*1%), rgba(255,255,255,.4) 0);}
  .ring.we i{color:var(--we);}
  .skill-card{cursor:pointer; transition:transform .18s, box-shadow .18s;}
  .skill-card:hover{transform:translateY(-3px); box-shadow:0 12px 28px rgba(80,100,70,.16);}
  .skill-card .ic-big{font-size:28px; margin-bottom:4px;}
  .idea-box{width:100%; border:1px solid rgba(255,255,255,.6); border-radius:12px; padding:10px 12px; min-height:60px; resize:vertical; background:rgba(255,255,255,.5); backdrop-filter:blur(8px);}
  .idea-box:focus{outline:none; border-color:var(--green); background:rgba(255,255,255,.75); box-shadow:0 0 0 3px rgba(127,168,116,.15);}
  .idea-list{margin-top:10px; display:flex; flex-direction:column; gap:6px;}
  .idea-item{display:flex; gap:8px; align-items:center; background:rgba(238,243,234,.5); border:1px solid rgba(255,255,255,.5); border-radius:9px; padding:7px 10px; font-size:13px;}
  .idea-item .x{margin-left:auto; color:var(--muted); cursor:pointer;}

  /* forms */
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:13px; color:var(--muted); margin-bottom:5px;}
  .inp,.sel,.tar{width:100%; border:1px solid rgba(255,255,255,.6); border-radius:10px; padding:9px 11px; background:rgba(255,255,255,.5); backdrop-filter:blur(6px); outline:none;}
  .inp:focus,.sel:focus,.tar:focus{border-color:var(--green); background:rgba(255,255,255,.75); box-shadow:0 0 0 3px rgba(127,168,116,.15);}
  .tar{resize:vertical; min-height:64px;}
  .row{display:flex; gap:8px;}
  .row>*{flex:1;}

  /* tasks */
  .task{display:flex; align-items:center; gap:10px; padding:10px 12px; border:1px solid rgba(255,255,255,.6); border-radius:13px; margin-bottom:8px; background:rgba(255,255,255,.5); backdrop-filter:blur(8px); transition:background .15s;}
  .task:hover{background:rgba(255,255,255,.7);}
  .task.done{background:rgba(238,243,234,.5);}
  .task.done .t-name{text-decoration:line-through; color:var(--muted);}
  .task .chk{width:20px;height:20px;border-radius:7px;border:2px solid var(--green); flex:0 0 20px; display:flex;align-items:center;justify-content:center; color:#fff; font-size:13px; cursor:pointer; background:rgba(255,255,255,.4);}
  .task.done .chk{background:var(--green); border-color:var(--green);}
  .task .chk.ai{border-color:var(--ai);} .task.done .chk.ai{background:var(--ai);border-color:var(--ai);}
  .task .chk.shoot{border-color:var(--shoot);} .task.done .chk.shoot{background:var(--shoot);border-color:var(--shoot);}
  .task .chk.edit{border-color:var(--edit);} .task.done .chk.edit{background:var(--edit);border-color:var(--edit);}
  .task .chk.we{border-color:var(--we);} .task.done .chk.we{background:var(--we);border-color:var(--we);}
  .t-name{flex:1; font-size:15px;}
  .t-eta{font-size:12px; color:var(--muted);}
  .t-del{color:var(--muted); padding:4px 6px; font-size:15px; cursor:pointer;}
  .t-del:hover{color:var(--hi);}
  .t-today{font-size:11px; padding:3px 8px; border-radius:8px; background:rgba(238,243,234,.6); color:var(--green-d); cursor:pointer; border:1px solid rgba(255,255,255,.5);}
  .t-today.on{background:var(--green); color:#fff; border-color:var(--green); box-shadow:0 2px 8px rgba(127,168,116,.4);}

  /* goals */
  .goal{background:rgba(255,255,255,.5); border:1px solid rgba(255,255,255,.6); border-radius:16px; margin-bottom:14px; overflow:hidden; backdrop-filter:blur(10px); box-shadow:var(--shadow-sm), var(--inset);}
  .goal-h{display:flex; align-items:center; gap:10px; padding:13px 15px; cursor:pointer;}
  .goal-h .g-icon{font-size:18px;}
  .goal-h .g-title{font-weight:700; font-size:15px; flex:1;}
  .goal-h .g-meta{font-size:12px; color:var(--muted);}
  .goal-h .g-arrow{transition:transform .2s; color:var(--muted);}
  .goal.open .g-arrow{transform:rotate(90deg);}
  .goal-body{display:none; padding:0 15px 14px; border-top:1px solid rgba(255,255,255,.5);}
  .goal.open .goal-body{display:block;}
  .goal-why{font-size:13px; color:#3d4a36; background:rgba(238,243,234,.55); border:1px solid rgba(255,255,255,.4); border-radius:9px; padding:8px 11px; margin:10px 0;}
  .goal-progress{display:flex; align-items:center; gap:10px; margin:8px 0 12px;}
  .goal-progress .bar{flex:1; height:8px; border-radius:4px; background:rgba(255,255,255,.4); overflow:hidden;}
  .goal-progress .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--green-l),var(--green)); transition:width .3s;}
  .goal-progress .pct{font-size:13px; font-weight:700; color:var(--green-d); min-width:42px; text-align:right;}
  .sub-task{display:flex; align-items:center; gap:9px; padding:8px 10px; border-radius:10px; margin-bottom:5px; background:rgba(255,255,255,.45); border:1px solid rgba(255,255,255,.5);}
  .sub-task:hover{background:rgba(255,255,255,.65);}
  .sub-task.done{background:rgba(238,243,234,.5);}
  .sub-task.done .st-name{text-decoration:line-through; color:var(--muted);}
  .sub-task .chk{width:18px;height:18px;border-radius:5px;border:2px solid var(--green); flex:0 0 18px; display:flex;align-items:center;justify-content:center; color:#fff; font-size:11px; cursor:pointer; background:rgba(255,255,255,.4);}
  .sub-task.done .chk{background:var(--green);border-color:var(--green);}
  .st-name{flex:1; font-size:14px;}
  .st-del{color:var(--muted); cursor:pointer; font-size:14px; padding:2px 4px;}
  .st-del:hover{color:var(--hi);}

  .seg{display:inline-flex; background:rgba(255,255,255,.4); border-radius:10px; padding:3px; gap:3px; margin-bottom:14px;}
  .seg button{padding:6px 14px; border-radius:8px; font-size:13px; color:var(--muted);}
  .seg button.on{background:rgba(255,255,255,.8); color:var(--green-d); font-weight:700; box-shadow:var(--shadow-sm);}

  .pill{display:inline-block; padding:3px 10px; border-radius:20px; font-size:12px; background:rgba(238,243,234,.6); color:var(--green-d); margin:2px;}
  .tag{display:inline-block; padding:2px 8px; border-radius:8px; font-size:11px; background:rgba(238,243,234,.6); color:var(--green-d); margin:2px 3px 2px 0; border:1px solid rgba(255,255,255,.4);}
  .tag.ai{background:var(--ai-bg); color:var(--ai);}
  .tag.shoot{background:var(--shoot-bg); color:var(--shoot);}
  .tag.edit{background:var(--edit-bg); color:var(--edit);}
  .tag.we{background:var(--we-bg); color:var(--we);}

  .muted{color:var(--muted);} .small{font-size:13px;}
  .empty-tip{padding:28px; text-align:center; color:var(--muted);}
  .bar{height:8px; border-radius:4px; background:rgba(255,255,255,.4); overflow:hidden; margin-top:5px;}
  .bar i{display:block; height:100%; background:linear-gradient(90deg,var(--green-l),var(--green));}
  .kv{display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed rgba(255,255,255,.5); font-size:14px;}
  .kv:last-child{border-bottom:none;}

  /* add form */
  .add-form{background:rgba(238,243,234,.4); border:1px dashed rgba(167,196,155,.7); border-radius:16px; padding:14px; margin-bottom:16px; backdrop-filter:blur(8px);}
  .add-form.collapsed{padding:10px 14px;}

  /* sync page */
  .sync-status{font-size:13px; padding:10px 12px; border-radius:10px; background:rgba(238,243,234,.55); border:1px solid rgba(255,255,255,.5); margin-bottom:12px;}
  .sync-status.err{background:rgba(246,222,222,.6); color:#B04848;}

  /* 透明线性图标 */
  .ico{flex:0 0 auto; vertical-align:middle;}
  .nav-item .ic{display:flex;align-items:center;}
  .nav-item .ico{opacity:.78;}
  .nav-item.active .ico{opacity:1;}
  .card-h .ico{opacity:.68; vertical-align:-3px;}
  .ic-big{display:flex;align-items:center;justify-content:center;}
  .skill-card .ico{opacity:.5;}
  .g-icon,.g-arrow{display:flex;align-items:center;}
  .g-icon .ico{opacity:.6;}
  .g-arrow .ico{opacity:.7;}
  .goal-why .ico{opacity:.7; vertical-align:-3px;}
  .t-del,.st-del,.idea-item .x,.t-move,.st-move,.g-move{display:flex;align-items:center;}
  .t-move,.st-move,.g-move{padding:3px 4px; cursor:pointer; border-radius:6px; transition:background .15s;}
  .t-move:hover,.st-move:hover,.g-move:hover{background:rgba(255,255,255,.45);}
  .t-del .ico,.st-del .ico{opacity:.55;}
  /* 箭头图标禁用指针事件，确保点击永远落在按钮 span 上，避免 iOS 上点不动 */
  .t-move .ico,.st-move .ico,.g-move .ico{pointer-events:none; opacity:.4; transition:opacity .15s;}
  .t-move:hover .ico,.st-move:hover .ico,.g-move:hover .ico{opacity:.9;}
  .idea-item .x .ico{opacity:.6;}
  .brand .logo .ico{opacity:.88;}
  .btn .ico{opacity:.95; vertical-align:-2px;}

  @media(max-width:760px){
    #sidebar{transform:translateX(-100%);}
    #sidebar.open{transform:translateX(0);}
    #overlay.show{display:block;}
    #main{margin-left:0;}
    .hamburger{display:block;}
    #content{padding:14px;}
    .top-title{font-size:15px;}
  }
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="logo"><svg class="ico" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5.3"/><path d="M12 13.3V21"/><path d="M9 21h6"/></svg></span>技能学习台</div>
    <div id="nav"></div>
    <div class="side-foot">
      <div class="sync-mini"><span>同步状态</span><span class="sync-dot" id="syncDot"></span></div>
    </div>
  </aside>
  <div id="overlay" data-act="close-sidebar"></div>
  <div id="main">
    <header id="topbar">
      <button class="hamburger" data-act="open-sidebar"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <span class="top-title" id="topTitle">概览</span>
      <span class="top-spacer"></span>
      <span class="top-date" id="topDate"></span>
      <button class="btn sm" data-act="nav" data-arg="sync">同步</button>
    </header>
    <div id="content"></div>
  </div>
</div>

<script>
/* ============ 数据层 ============ */
const PREFIX='sls:';  // skill-learning-station
const DB={
  get(k,d){ try{ const v=localStorage.getItem(PREFIX+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(PREFIX+k, JSON.stringify(v)); }catch(e){ console.warn(e);} }
};

// 四大技能分类
const SKILL_DEFS={
  ai:     {name:'AI',    icon:'ai',     color:'ai',    cls:'ai'},
  shoot:  {name:'拍摄',  icon:'camera', color:'shoot', cls:'shoot'},
  edit:   {name:'剪辑',  icon:'edit',   color:'edit',  cls:'edit'},
  wemedia:{name:'自媒体',icon:'play',   color:'we',    cls:'we'}
};

// 默认初始数据 —— 契合李李方向
const DEFAULT_SKILLS={
  ai:{
    goals:[
      {id:'g-ai-1', title:'掌握 AI 工具日常使用', why:'让 AI 成为得力助手，提升内容生产效率', deadline:'', created:'2026-07-28', archived:false,
        tasks:[
          {id:'t-ai-1a', text:'熟悉 3 款主流 AI 对话工具（ChatGPT/Claude/Gemini）的差异与适用场景', done:false, est_min:60, today:false},
          {id:'t-ai-1b', text:'学习 Prompt 工程基础：角色设定、少样本、思维链', done:false, est_min:90, today:true},
          {id:'t-ai-1c', text:'实践 10 个不同类型的 Prompt 并整理成个人模板库', done:false, est_min:120, today:false},
          {id:'t-ai-1d', text:'搭建自己的常用 AI 工具清单与使用笔记', done:false, est_min:45, today:false}
        ]},
      {id:'g-ai-2', title:'AI 辅助内容创作工作流', why:'把 AI 嵌入写作/脚本/分镜环节，形成稳定产出流', deadline:'', created:'2026-07-28', archived:false,
        tasks:[
          {id:'t-ai-2a', text:'用 AI 辅助完成一篇结构完整的图文内容', done:false, est_min:60, today:false},
          {id:'t-ai-2b', text:'实践 AI 图片生成（Midjourney/即梦 等）并产出 5 张可用素材', done:false, est_min:90, today:false},
          {id:'t-ai-2c', text:'梳理"选题→大纲→初稿→润色"的 AI 协作流程文档', done:false, est_min:60, today:false}
        ]}
    ]
  },

/* ============ 数据查询辅助 ============ */
function allTasksFlat(){
  // 返回 [{skill, goalId, goalTitle, task}] 扁平结构
  const out=[];
  const sk=Skills();
  Object.keys(SKILL_DEFS).forEach(k=>{
    (sk[k]&&sk[k].goals||[]).forEach(g=>{
      (g.tasks||[]).forEach(t=> out.push({skill:k, goalId:g.id, goalTitle:g.title, task:t}));
    });
  });
  return out;
}
function todayTasksFlat(){
  // 所有 today=true 的技能任务
  return allTasksFlat().filter(x=>x.task.today && !x.task.done);
}
function goalProgress(g){
  const ts=g.tasks||[]; if(!ts.length)return 0;
  return Math.round(ts.filter(t=>t.done).length/ts.length*100);
}
function skillProgress(skillKey){
  const sk=Skills(); const goals=(sk[skillKey]&&sk[skillKey].goals)||[];
  let total=0,done=0;
  goals.forEach(g=>{ (g.tasks||[]).forEach(t=>{total++; if(t.done)done++;}); });
  return {total,done,pct:total?Math.round(done/total*100):0};
}
function findGoal(skillKey,goalId){
  const sk=Skills(); const goals=(sk[skillKey]&&sk[skillKey].goals)||[];
  return goals.find(g=>g.id===goalId);
}
function findTask(skillKey,goalId,taskId){
  const g=findGoal(skillKey,goalId); if(!g)return null;
  return (g.tasks||[]).find(t=>t.id===taskId);
}

/* ============ 同步层 (GitHub Gist) ============ */
const GIST_FILE='skill-learning.json';
function gistApi(path,opts,token){
  opts=opts||{}; token=token||Settings().token;
  return fetch('https://api.github.com'+path,{
    method:opts.method||'GET',
    headers:Object.assign({'Content-Type':'application/json','Accept':'application/vnd.github+json'}, token?{'Authorization':'token '+token}:{}),
    body:opts.body?JSON.stringify(opts.body):undefined
  });
}
function collectAll(){
  return {skills:Skills(),quick_tasks:QuickTasks(),ideas:Ideas(),settings:{gistId:Settings().gistId,token:''}};
}
function mergeVal(a,b){ if(a==null)return b; if(b==null)return a; if(typeof a!=='object'||typeof b!=='object'||Array.isArray(a)||Array.isArray(b))return b; const o={}; for(const k in a)o[k]=a[k]; for(const k in b)o[k]=b[k]; return o; }
function mergeArrById(a,b){ const m={}; (a||[]).forEach(x=>m[x.id]=x); (b||[]).forEach(x=>{ if(m[x.id])m[x.id]=Object.assign({},m[x.id],x); else m[x.id]=x; }); return Object.values(m); }
function applyRemote(remote){
  if(!remote)return;
  if(remote.skills){
    const local=Skills(); const remoteSk=remote.skills;
    Object.keys(SKILL_DEFS).forEach(k=>{
      if(!remoteSk[k])return;
      const lg=local[k]||{goals:[]}; const rg=remoteSk[k].goals||[];
      local[k]={goals:mergeArrById(lg.goals||[], rg)};
      // 合并 goal 内部 tasks
      local[k].goals.forEach(g=>{
        const rg2=rg.find(x=>x.id===g.id);
        if(rg2) g.tasks=mergeArrById(g.tasks||[], rg2.tasks||[]);
      });
    });
    saveSkills(local);
  }
  if(remote.quick_tasks){
    const q=QuickTasks(); const rq=remote.quick_tasks||{};
    for(const d in rq){ q[d]=mergeArrById(q[d]||[], rq[d]||[]); }
    saveQuickTasks(q);
  }
  if(remote.ideas) saveIdeas(mergeArrById(Ideas(), remote.ideas||[]));
}
let lastSync={status:'idle',msg:''};
async function testConn(){
  const s=Settings(); if(!s.token){return {ok:false,msg:'未填写 Token'};}
  try{ const r=await gistApi('/user'); if(r.status===401)return {ok:false,msg:'Token 无效或无 gist 权限'}; if(r.status===403)return {ok:false,msg:'请求受限（可能限流）'}; if(!r.ok)return {ok:false,msg:'网络错误 '+r.status}; return {ok:true,msg:'连接正常'}; }
  catch(e){ return {ok:false,msg:'无法连接 api.github.com'}; }
}
async function doSync(manual){
  const s=Settings();
  if(!s.gistId||!s.token){ lastSync={status:'err',msg:'请先填写 Gist ID 与 Token'}; render(); return; }
  try{
    const get=await gistApi('/gists/'+s.gistId);
    if(get.status===404){
      const mk=await gistApi('/gists',{method:'POST',body:{public:false,files:{[GIST_FILE]:{content:JSON.stringify(collectAll())}}}});
      if(!mk.ok){lastSync={status:'err',msg:'创建失败 '+mk.status};}
      else{const j=await mk.json(); const id=j.id; const ns=Settings(); ns.gistId=id; saveSettings(ns); lastSync={status:'ok',msg:'已创建新 Gist 并同步'};}
      render(); return;
    }
    if(!get.ok){lastSync={status:'err',msg:'读取失败 '+get.status}; render(); return;}
    const j=await get.json();
    const remote=j.files&&j.files[GIST_FILE]?JSON.parse(j.files[GIST_FILE].content||'{}'):{};
    applyRemote(remote);
    const put=await gistApi('/gists/'+s.gistId,{method:'PATCH',body:{files:{[GIST_FILE]:{content:JSON.stringify(collectAll())}}}});
    lastSync=put.ok?{status:'ok',msg:'同步成功 '+new Date().toLocaleTimeString()}:{status:'err',msg:'上传失败 '+put.status};
  }catch(e){ lastSync={status:'err',msg:'同步异常：'+(e.message||e)}; }
  render();
}

    goals.forEach(g=>{
      const gp=goalProgress(g);
      const openCls=state.openGoals[g.id]?'open':'';
      const dl=g.deadline?` · 截止 ${g.deadline}`:'';
      html+=`<div class="goal ${openCls}" data-goal="${g.id}">
        <div class="goal-h" data-act="toggle-goal" data-arg="${g.id}">
          <span class="g-arrow">${icon('chevron',16)}</span>
          <span class="g-icon">${icon(def.icon,18)}</span>
          <span class="g-title">${esc(g.title)}</span>
          <span class="g-meta">${(g.tasks||[]).filter(t=>t.done).length}/${(g.tasks||[]).length}${dl}</span>
          <span class="g-move" data-act="move-goal" data-arg="${skillKey}|${g.id}|up" title="上移项目">${icon('up',14)}</span>
          <span class="g-move" data-act="move-goal" data-arg="${skillKey}|${g.id}|down" title="下移项目">${icon('down',14)}</span>
        </div>
        <div class="goal-body">
          ${g.why?`<div class="goal-why">${icon('target',16)} ${esc(g.why)}</div>`:''}
          <div class="goal-progress">
            <span class="small muted">完成度</span>
            <div class="bar"><i style="width:${gp}%"></i></div>
            <span class="pct">${gp}%</span>
          </div>
          <div class="card-h" style="font-size:13px;margin-top:6px">任务拆解</div>`;
      (g.tasks||[]).forEach(t=>{
        html+=`<div class="sub-task ${t.done?'done':''}" data-act="toggle-task" data-arg="${skillKey}|${g.id}|${t.id}">
          <div class="chk ${def.cls}">${t.done?icon('check',13):''}</div>
          <div class="st-name">${esc(t.text)}</div>
          ${t.est_min?`<span class="t-eta">${t.est_min}分</span>`:''}
          <span class="t-today ${t.today?'on':''}" data-act="toggle-today" data-arg="${skillKey}|${g.id}|${t.id}">${t.today?'今日':'加入今日'}</span>
          <span class="st-move" data-act="move-task" data-arg="${skillKey}|${g.id}|${t.id}|up">${icon('up',14)}</span>
          <span class="st-move" data-act="move-task" data-arg="${skillKey}|${g.id}|${t.id}|down">${icon('down',14)}</span>
          <span class="st-del" data-act="del-task" data-arg="${skillKey}|${g.id}|${t.id}">${icon('trash',15)}</span>
        </div>`;
      });
      html+=`<div class="row" style="margin-top:8px">
          <input class="inp" id="taskText-${g.id}" placeholder="新增任务…" style="flex:2">
          <input class="inp" id="taskEta-${g.id}" placeholder="分钟" style="flex:0 0 80px" inputmode="numeric">
          <button class="btn sm" data-act="add-task" data-arg="${skillKey}|${g.id}">添加任务</button>
        </div>
        <div style="margin-top:10px"><button class="btn sm ghost" data-act="archive-goal" data-arg="${skillKey}|${g.id}">归档目标</button></div>
      </div></div>`;
    });
  }

  return html;
}

function addGoal(skillKey){
  const title=document.getElementById('goalTitle').value.trim();
  if(!title){alert('请填写目标标题');return;}
  const why=document.getElementById('goalWhy').value.trim();
  const deadline=document.getElementById('goalDeadline').value;
  const sk=Skills(); if(!sk[skillKey])sk[skillKey]={goals:[]};
  sk[skillKey].goals.push({id:uid(),title,why,deadline,created:today(),archived:false,tasks:[]});
  saveSkills(sk); state.openGoals={}; render();
}
function toggleGoal(goalId){ state.openGoals[goalId]=!state.openGoals[goalId]; render(); }
function archiveGoal(skillKey,goalId){
  if(!confirm('归档此目标？归档后可在同步设置中查看，但不再显示在学习页。'))return;
  const sk=Skills(); const goals=sk[skillKey].goals;
  const i=goals.findIndex(g=>g.id===goalId);
  if(i>=0){ goals[i].archived=true; saveSkills(sk); render(); }
}
function addTask(skillKey,goalId){
  const txt=document.getElementById('taskText-'+goalId).value.trim();
  if(!txt)return;
  const eta=parseInt(document.getElementById('taskEta-'+goalId).value)||0;
  const sk=Skills(); const g=findGoal(skillKey,goalId);
  if(g){ g.tasks=g.tasks||[]; g.tasks.push({id:uid(),text:txt,done:false,est_min:eta,today:false}); saveSkills(sk); render(); }
}
function toggleTask(skillKey,goalId,taskId){
  const sk=Skills(); const t=findTask(skillKey,goalId,taskId);
  if(t){ t.done=!t.done; saveSkills(sk); render(); }
}
function toggleToday(skillKey,goalId,taskId){
  const sk=Skills(); const t=findTask(skillKey,goalId,taskId);
  if(t){ t.today=!t.today; saveSkills(sk); render(); }
}
function delTask(skillKey,goalId,taskId){
  if(!confirm('删除此任务？'))return;
  const sk=Skills(); const g=findGoal(skillKey,goalId);
  if(g){ g.tasks=(g.tasks||[]).filter(t=>t.id!==taskId); saveSkills(sk); render(); }
}
function toggleTodayTask(skillKey,goalId,taskId){
  // 概览页点击今日任务 -> 标记完成
  const sk=Skills(); const t=findTask(skillKey,goalId,taskId);
  if(t){ t.done=!t.done; if(t.done)t.today=false; saveSkills(sk); render(); }
}
// 任务排序：技能页目标内任务上下移
function moveTask(skillKey,goalId,taskId,dir){
  const sk=Skills(); const g=findGoal(skillKey,goalId); if(!g)return;
  const ts=g.tasks||[]; const i=ts.findIndex(t=>t.id===taskId); if(i<0)return;
  const j= dir==='up'? i-1 : i+1;
  if(j<0||j>=ts.length)return;
  const tmp=ts[i]; ts[i]=ts[j]; ts[j]=tmp;
  saveSkills(sk); render();
}
// 目标（项目）排序：技能页内目标上下移
function moveGoal(skillKey,goalId,dir){
  const sk=Skills(); const goals=(sk[skillKey]&&sk[skillKey].goals)||[];
  const i=goals.findIndex(g=>g.id===goalId); if(i<0)return;
  const j= dir==='up'? i-1 : i+1;
  if(j<0||j>=goals.length)return;
  const tmp=goals[i]; goals[i]=goals[j]; goals[j]=tmp;
  saveSkills(sk); render();
}
// 今日计划自定义顺序（按日期存 id 列表）
function getTodayPlanOrder(date){ const TP=DB.get('today_plan',{}); return TP[date]||[]; }
function setTodayPlanOrder(date,ids){ const TP=DB.get('today_plan',{}); TP[date]=ids; DB.set('today_plan',TP); }
function moveTodayTask(planId,dir){
  const d=today();
  // 构建当前今日任务的完整 planId 列表（实际显示顺序：order 优先 + 未记录的按原序补齐）
  const tt=todayTasksFlat().map(x=>x.skill+'|'+x.goalId+'|'+x.task.id);
  const qt=(QuickTasks()[d]||[]).filter(x=>!x.done).map(x=>'q|'+x.id);
  const all=[...tt, ...qt];
  const order=getTodayPlanOrder(d);
  const ordered=[];
  order.forEach(id=>{ if(all.includes(id) && !ordered.includes(id)) ordered.push(id); });
  all.forEach(id=>{ if(!ordered.includes(id)) ordered.push(id); });
  const i=ordered.indexOf(planId); if(i<0)return;
  const j= dir==='up'? i-1 : i+1;
  if(j<0||j>=ordered.length)return;
  ordered.splice(i,1); ordered.splice(j,0,planId);
  setTodayPlanOrder(d,ordered); render();
}

/* ============ 快速任务（概览页） ============ */
function addQuickTask(text,skill,eta){
  const t=today(); const Q=QuickTasks(); const arr=Q[t]||[];
  arr.push({id:uid(),text,skill:skill||'',done:false,est_min:eta||0});
  Q[t]=arr; saveQuickTasks(Q); render();
}
function toggleQuick(id){
  const t=today(); const Q=QuickTasks(); const arr=Q[t]||[];
  const q=arr.find(x=>x.id===id); if(q){ q.done=!q.done; saveQuickTasks(Q); render(); }
}
function delQuick(id){
  const t=today(); const Q=QuickTasks(); let arr=Q[t]||[];
  arr=arr.filter(x=>x.id!==id); Q[t]=arr; saveQuickTasks(Q); render();
}
function showQuickAddForm(){
  let opts='<option value="">通用</option>';
  Object.keys(SKILL_DEFS).forEach(k=>{ opts+=`<option value="${k}">${SKILL_DEFS[k].name}</option>`; });
  const html=`<div class="card"><div class="card-h">快速添加今日任务</div>
    <div class="row"><input class="inp" id="qtText" placeholder="任务内容…" style="flex:2">
    <select class="sel" id="qtSkill" style="flex:0 0 100px">${opts}</select>
    <input class="inp" id="qtEta" placeholder="分钟" style="flex:0 0 70px" inputmode="numeric"></div>
    <div style="margin-top:8px;display:flex;gap:8px">
      <button class="btn sm" data-act="save-quick">保存</button>
      <button class="btn sm ghost" data-act="cancel-quick">取消</button>
    </div></div>`;
  // 插入到今日计划卡片前
  const cards=document.querySelectorAll('#content .card');
  if(cards.length>1){ const div=document.createElement('div'); div.innerHTML=html; cards[1].parentNode.insertBefore(div.firstChild, cards[1]); }
  else { document.getElementById('content').insertAdjacentHTML('afterbegin',html); }
  document.getElementById('qtText').focus();
}

/* ============ 页面：同步 ============ */
function pageSync(){
  const s=Settings();
  let html='';
  html+=card('GitHub Gist 同步', `<div class="sync-status ${lastSync.status==='err'?'err':''}" id="syncMsg">${lastSync.msg||'尚未同步'}</div>
    <div class="field"><label>Gist ID（所有设备填同一个）</label><input class="inp" id="gistId" value="${esc(s.gistId)}" placeholder="留空则首次同步时自动创建"></div>
    <div class="field"><label>Token（classic，仅 gist 权限）</label><input class="inp" id="token" type="password" value="${esc(s.token)}" placeholder="ghp_..."></div>
    <div class="row">
      <button class="btn" data-act="save-sync">保存设置</button>
      <button class="btn ghost" data-act="test-conn">测试连接</button>
      <button class="btn sm" data-act="do-sync">立即同步</button>
    </div>
    <div class="small muted" style="margin-top:10px">提示：Gist ID 须与手机端一致；Token 仅存本地浏览器。建议在 GitHub 设置中定期更换。</div>`);
  // 数据统计
  const sk=Skills();
  let goalCount=0,taskCount=0,doneCount=0;
  Object.keys(SKILL_DEFS).forEach(k=>{
    (sk[k]&&sk[k].goals||[]).forEach(g=>{ goalCount++; (g.tasks||[]).forEach(t=>{taskCount++; if(t.done)doneCount++;}); });
  });
  const ideaCount=Ideas().length;
  const archivedGoals=[];
  Object.keys(SKILL_DEFS).forEach(k=>{
    (sk[k]&&sk[k].goals||[]).forEach(g=>{ if(g.archived)archivedGoals.push(SKILL_DEFS[k].name+' · '+g.title); });
  });
  html+=card('数据统计', `<div class="kv"><span>学习目标</span><b>${goalCount}</b></div>
    <div class="kv"><span>任务总数</span><b>${taskCount}</b></div>
    <div class="kv"><span>已完成任务</span><b>${doneCount}</b></div>
    <div class="kv"><span>灵感数</span><b>${ideaCount}</b></div>`);
  if(archivedGoals.length){
    html+=card('已归档目标', archivedGoals.map(g=>`<div class="small" style="padding:4px 0;display:flex;align-items:center;gap:6px;opacity:.8">${icon('archive',15)}<span>${esc(g)}</span></div>`).join(''));
  }
  return html;
}

/* ============ 主渲染 ============ */
function render(){
  document.getElementById('nav').innerHTML=sidebarHTML();
  document.getElementById('topTitle').textContent=PAGE_TITLE[state.page]||'';
  document.getElementById('topDate').textContent=today()+' '+jsWeekDay(today());
  const dot=document.getElementById('syncDot'); dot.className='sync-dot'+(lastSync.status==='ok'?' ok':lastSync.status==='err'?' err':'');
  let c='';
  if(state.page==='home')c=pageHome();
  else if(state.page in SKILL_DEFS)c=pageSkill(state.page);
  else if(state.page==='sync')c=pageSync();
  document.getElementById('content').innerHTML=c;
  if(state.page==='home'){
    renderIdeas();
    const inp=document.getElementById('ideaInput');
    if(inp){ inp.addEventListener('blur',saveIdea); inp.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();saveIdea();}}); }
  }
}

/* ============ 事件 ============ */
const H={
  'open-sidebar':()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');},
  'close-sidebar':()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');},
  'nav':(arg)=>{ state.page=arg; state.skill=arg in SKILL_DEFS?arg:state.skill; document.getElementById('sidebar').classList.remove('open'); document.getElementById('overlay').classList.remove('show'); state.openGoals={}; render(); window.scrollTo(0,0); },
  'toggle-goal':(arg)=>toggleGoal(arg),
  'add-goal':(arg)=>addGoal(arg),
  'archive-goal':(arg)=>{const [sk,gid]=arg.split('|'); archiveGoal(sk,gid);},
  'add-task':(arg)=>{const [sk,gid]=arg.split('|'); addTask(sk,gid);},
  'toggle-task':(arg)=>{const [sk,gid,tid]=arg.split('|'); toggleTask(sk,gid,tid);},
  'toggle-today':(arg)=>{const [sk,gid,tid]=arg.split('|'); toggleToday(sk,gid,tid);},
  'toggle-today-task':(arg)=>{const [sk,gid,tid]=arg.split('|'); toggleTodayTask(sk,gid,tid);},
  'del-task':(arg)=>{const [sk,gid,tid]=arg.split('|'); delTask(sk,gid,tid);},
  'move-task':(arg)=>{const p=arg.split('|'); moveTask(p[0],p[1],p[2],p[3]);},
  'move-goal':(arg)=>{const p=arg.split('|'); moveGoal(p[0],p[1],p[2]);},
  'move-today':(arg,t)=>moveTodayTask(arg,t.dataset.dir),
  'add-quick':showQuickAddForm,
  'save-quick':()=>{
    const text=document.getElementById('qtText').value.trim(); if(!text)return;
    const skill=document.getElementById('qtSkill').value;
    const eta=parseInt(document.getElementById('qtEta').value)||0;
    addQuickTask(text,skill,eta);
  },
  'cancel-quick':()=>render(),
  'toggle-quick':(arg)=>toggleQuick(arg),
  'del-quick':(arg)=>delQuick(arg),
  'del-idea':(arg)=>{const I=Ideas(); saveIdeas(I.filter(x=>x.id!==arg)); renderIdeas();},
  'save-sync':()=>{const s=Settings(); s.gistId=document.getElementById('gistId').value.trim(); s.token=document.getElementById('token').value.trim(); saveSettings(s); lastSync={status:'ok',msg:'设置已保存，可点立即同步'}; render();},
  'test-conn':async()=>{ lastSync={status:'idle',msg:'连接测试中…'}; render(); const r=await testConn(); lastSync=r.ok?{status:'ok',msg:r.msg}:{status:'err',msg:r.msg}; render(); },
  'do-sync':()=>{ doSync(true); }
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t)return;
  const act=t.dataset.act; const arg=t.dataset.arg;
  if(H[act]){ e.preventDefault(); H[act](arg,t); }
});

render();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
