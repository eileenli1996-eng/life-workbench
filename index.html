<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7FA874">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<title>挑战900块花1个月</title>
<style>
  :root{
    --green:#7FA874; --green-d:#4A7042; --green-l:#A7C49B; --green-bg:rgba(238,243,234,.55);
    --ink:#2A3326; --muted:#6F7A68; --line:rgba(255,255,255,.6);
    --hi:#D98C8C; --warn:#D69B5E; --info:#6B8FD6;
    --glass:rgba(255,255,255,.5);
    --blur:saturate(180%) blur(20px);
    --shadow:0 8px 32px rgba(80,100,70,.14);
    --shadow-sm:0 2px 12px rgba(80,100,70,.08);
    --inset:inset 0 1px 0 rgba(255,255,255,.75);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);font-size:15px;line-height:1.5;
    background:
      radial-gradient(circle at 12% 16%,rgba(127,168,116,.45),transparent 38%),
      radial-gradient(circle at 88% 10%,rgba(107,143,214,.28),transparent 40%),
      radial-gradient(circle at 85% 85%,rgba(217,140,140,.22),transparent 44%),
      radial-gradient(circle at 15% 88%,rgba(93,157,168,.26),transparent 44%),
      linear-gradient(135deg,#e9efe5 0%,#f4f7f0 100%);
    background-attachment:fixed;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
  input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink);}
  ::-webkit-scrollbar{width:8px;height:8px;}::-webkit-scrollbar-thumb{background:rgba(167,196,155,.55);border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  #app{display:flex;min-height:100vh;}
  #sidebar{width:220px;flex:0 0 220px;background:rgba(255,255,255,.45);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border-right:1px solid rgba(255,255,255,.55);box-shadow:var(--inset),4px 0 24px rgba(80,100,70,.06);
    display:flex;flex-direction:column;padding:18px 12px;position:fixed;top:0;bottom:0;left:0;z-index:30;transition:transform .25s ease;overflow-y:auto;}
  .brand{display:flex;align-items:center;gap:9px;padding:4px 8px 16px;font-weight:700;font-size:16px;color:var(--green-d);}
  .brand .logo{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.45);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.6);box-shadow:var(--inset),0 2px 10px rgba(80,100,70,.08);display:flex;align-items:center;justify-content:center;color:var(--green-d);flex-shrink:0;}
  .brand .b-sub{font-size:11px;font-weight:400;color:var(--muted);}
  .nav-item{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:12px;color:var(--ink);margin-bottom:3px;font-size:14px;transition:all .18s;cursor:pointer;border:1px solid transparent;}
  .nav-item .ic{font-size:17px;width:22px;text-align:center;display:flex;align-items:center;justify-content:center;}
  .nav-item:hover{background:rgba(255,255,255,.5);}
  .nav-item.active{background:rgba(127,168,116,.85);color:#fff;box-shadow:0 4px 14px rgba(127,168,116,.4),var(--inset);}
  .nav-item .nav-dot{width:7px;height:7px;border-radius:50%;margin-left:auto;}
  .side-foot{margin-top:auto;padding-top:12px;border-top:1px solid rgba(255,255,255,.5);}
  .sync-mini{font-size:12px;color:var(--muted);padding:6px 10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted);}
  .sync-dot.ok{background:var(--green);box-shadow:0 0 8px rgba(127,168,116,.6);}.sync-dot.err{background:var(--hi);box-shadow:0 0 8px rgba(217,140,140,.6);}
  .budget-mini{padding:4px 10px 8px;}
  .budget-mini .bm-lbl{font-size:11px;color:var(--muted);margin-bottom:4px;}
  .budget-mini .bm-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden;}
  .budget-mini .bm-bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green-l),var(--green));transition:width .4s;}
  .budget-mini .bm-row{display:flex;justify-content:space-between;font-size:11px;margin-top:3px;}

  #overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.22);backdrop-filter:blur(4px);z-index:25;}
  #main{flex:1;margin-left:220px;display:flex;flex-direction:column;min-width:0;}
  #topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.5);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
    border-bottom:1px solid rgba(255,255,255,.55);box-shadow:0 2px 16px rgba(80,100,70,.05);
    padding:12px 20px;display:flex;align-items:center;gap:12px;}
  .hamburger{display:none;font-size:22px;padding:2px 6px;}
  .top-title{font-weight:700;font-size:16px;}
  .top-spacer{flex:1;}
  .top-date{font-size:13px;color:var(--muted);}
  .btn{padding:8px 14px;border-radius:11px;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;font-size:14px;font-weight:600;transition:transform .15s,box-shadow .15s;box-shadow:0 4px 12px rgba(127,168,116,.4);}
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(127,168,116,.5);}
  .btn.ghost{background:rgba(255,255,255,.55);color:var(--green-d);border:1px solid rgba(255,255,255,.7);box-shadow:var(--inset),0 2px 8px rgba(80,100,70,.06);}
  .btn.ghost:hover{background:rgba(255,255,255,.75);}
  .btn.sm{padding:6px 11px;font-size:13px;border-radius:9px;}
  .btn.danger{background:rgba(255,255,255,.6);color:var(--hi);border:1px solid rgba(217,140,140,.5);box-shadow:var(--inset);}

  #content{padding:20px;max-width:1100px;width:100%;margin:0 auto;}

  .card{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,.6);
    border-radius:18px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow),var(--inset);}
  .card-h{font-weight:700;font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .card-h .sub{font-weight:400;font-size:13px;color:var(--muted);}
  .card-h .right{margin-left:auto;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  @media(max-width:880px){.grid4,.grid5{grid-template-columns:1fr 1fr;}.grid2,.grid3{grid-template-columns:1fr;}}

  .field{margin-bottom:12px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px;}
  .inp,.sel,.tar{width:100%;border:1px solid rgba(255,255,255,.6);border-radius:10px;padding:9px 11px;background:rgba(255,255,255,.5);backdrop-filter:blur(6px);outline:none;}
  .inp:focus,.sel:focus,.tar:focus{border-color:var(--green);background:rgba(255,255,255,.75);box-shadow:0 0 0 3px rgba(127,168,116,.15);}
  .tar{resize:vertical;min-height:64px;}
  .row{display:flex;gap:8px;}
  .row>*{flex:1;}

  .task{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.6);border-radius:13px;margin-bottom:8px;background:rgba(255,255,255,.5);backdrop-filter:blur(8px);transition:background .15s;}
  .task:hover{background:rgba(255,255,255,.7);}
  .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.4);overflow:hidden;margin-top:5px;}
  .bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green-l),var(--green));transition:width .3s;}
  .bar i.warn{background:linear-gradient(90deg,#E8C87C,var(--warn));}
  .bar i.over{background:linear-gradient(90deg,#E88A7C,var(--hi));}
  .kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.5);font-size:14px;}
  .kv:last-child{border-bottom:none;}
  .tag{display:inline-block;padding:2px 8px;border-radius:8px;font-size:11px;background:rgba(238,243,234,.6);color:var(--green-d);margin:2px 3px 2px 0;border:1px solid rgba(255,255,255,.4);}
  .muted{color:var(--muted);}.small{font-size:13px;}
  .empty-tip{padding:28px;text-align:center;color:var(--muted);}
  .ico{flex:0 0 auto;vertical-align:middle;}
  .nav-item .ico{opacity:.78;}.nav-item.active .ico{opacity:1;}
  .card-h .ico{opacity:.68;vertical-align:-3px;}

  /* stat card */
  .stat-card{text-align:center;padding:4px 0;}
  .stat-card .s-val{font-size:26px;font-weight:800;color:var(--green-d);line-height:1.2;}
  .stat-card .s-lbl{font-size:13px;color:var(--muted);}
  .stat-card .s-sub{font-size:11px;color:var(--muted);margin-top:2px;}
  .stat-card.danger .s-val{color:var(--hi);}
  .stat-card.warn .s-val{color:var(--warn);}

  /* ring big */
  .ring-big{--p:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--green) calc(var(--p)*1%),rgba(255,255,255,.4) 0);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .ring-big.over{background:conic-gradient(var(--hi) calc(var(--p)*1%),rgba(255,255,255,.4) 0);}
  .ring-big.warn{background:conic-gradient(var(--warn) calc(var(--p)*1%),rgba(255,255,255,.4) 0);}
  .ring-big i{width:84px;height:84px;border-radius:50%;background:rgba(255,255,255,.78);display:flex;align-items:center;justify-content:center;flex-direction:column;font-style:normal;}
  .ring-big i .pct{font-size:24px;font-weight:800;color:var(--green-d);}
  .ring-big i .lbl{font-size:11px;color:var(--muted);}
  .ring-big.over i .pct{color:var(--hi);}
  .ring-big.warn i .pct{color:var(--warn);}

  /* chip */
  .chip-row{display:flex;gap:10px;margin-bottom:14px;}
  .chip{flex:1;text-align:center;padding:12px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);backdrop-filter:blur(8px);box-shadow:var(--shadow-sm),var(--inset);}
  .chip .c-lbl{font-size:12px;color:var(--muted);}
  .chip .c-val{font-size:20px;font-weight:800;margin-top:4px;color:var(--green-d);}
  .chip.exp .c-val{color:var(--hi);}
  .chip.inc .c-val{color:var(--green);}

  /* tx row */
  .tx-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid rgba(255,255,255,.6);border-radius:13px;margin-bottom:8px;background:rgba(255,255,255,.5);backdrop-filter:blur(8px);transition:background .15s;}
  .tx-row:hover{background:rgba(255,255,255,.7);}
  .tx-row .tx-ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
  .tx-row .tx-info{flex:1;min-width:0;}
  .tx-row .tx-name{font-size:14px;font-weight:600;}
  .tx-row .tx-meta{font-size:12px;color:var(--muted);}
  .tx-row .tx-note{font-size:12px;color:var(--muted);font-style:italic;}
  .tx-row .tx-amt{font-size:16px;font-weight:800;flex-shrink:0;}
  .tx-row .tx-amt.exp{color:var(--hi);}
  .tx-row .tx-amt.inc{color:var(--green);}
  .tx-del{color:var(--muted);padding:4px 6px;font-size:15px;cursor:pointer;}
  .tx-del:hover{color:var(--hi);}

  /* cat row */
  .cat-row{padding:14px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);border-radius:16px;margin-bottom:10px;backdrop-filter:blur(8px);box-shadow:var(--shadow-sm),var(--inset);}
  .cat-row .cr-h{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .cat-row .cr-name{font-weight:700;font-size:15px;flex:1;}
  .cat-row .cr-amt{font-size:15px;font-weight:800;}
  .cat-row .cr-amt.over{color:var(--hi);}
  .cat-row .cr-amt.ok{color:var(--green);}
  .cat-row .cr-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px;}

  /* inv tile */
  .inv-tile{display:flex;align-items:center;gap:10px;padding:10px 14px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);border-radius:14px;backdrop-filter:blur(8px);box-shadow:var(--shadow-sm),var(--inset);transition:transform .18s,box-shadow .18s;}
  .inv-tile:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
  .inv-tile .it-info{flex:1;min-width:0;overflow:hidden;}
  .inv-tile .it-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inv-tile .it-note{font-size:11px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inv-tile .it-qty{font-size:18px;font-weight:800;color:var(--green-d);min-width:54px;text-align:right;flex-shrink:0;}
  .inv-tile .it-acts{display:flex;gap:4px;flex-shrink:0;}
  .btn.xs{padding:3px 8px;font-size:12px;border-radius:8px;line-height:1.4;}

  /* inv section */
  .inv-section{font-weight:700;font-size:14px;color:var(--green-d);padding:8px 0 6px;margin-bottom:10px;border-bottom:2px solid rgba(127,168,116,.25);display:flex;align-items:center;gap:8px;}
  .inv-section .sec-count{font-size:12px;font-weight:400;color:var(--muted);}

  /* wish row */
  .wish-row{display:flex;align-items:center;gap:14px;padding:14px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);border-radius:16px;margin-bottom:10px;backdrop-filter:blur(8px);border-left:4px solid var(--warn);transition:background .15s;}
  .wish-row:hover{background:rgba(255,255,255,.7);}
  .wish-row.ready{border-left-color:var(--green);}
  .wish-row.bought{opacity:.55;border-left-color:var(--muted);}
  .wish-row .wr-info{flex:1;}
  .wish-row .wr-name{font-weight:700;font-size:15px;}
  .wish-row .wr-price{font-size:16px;font-weight:800;color:var(--hi);margin-top:2px;}
  .wish-row .wr-reason{font-size:12px;color:var(--muted);margin-top:3px;font-style:italic;}
  .wish-row .wr-cd{text-align:center;min-width:80px;}
  .wish-row .wr-cd .num{font-size:24px;font-weight:800;}
  .wish-row .wr-cd .num.cooling{color:var(--warn);}
  .wish-row .wr-cd .num.ready{color:var(--green);}
  .wish-row .wr-cd .lbl{font-size:11px;color:var(--muted);}
  .wish-row .wr-acts{display:flex;flex-direction:column;gap:5px;}

  /* calendar */
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px;}
  .cal-h{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:4px 0;}
  .cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:14px;color:var(--ink);background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.4);position:relative;}
  .cal-day.checked{background:rgba(127,168,116,.35);color:var(--green-d);font-weight:700;}
  .cal-day.checked::after{content:'✓';position:absolute;top:1px;right:3px;font-size:9px;color:var(--green);}
  .cal-day.today{border:2px solid var(--green);font-weight:600;}
  .cal-day.empty{background:transparent;border:none;}

  /* checkin */
  .checkin-area{text-align:center;padding:20px 0;}
  .checkin-btn{padding:14px 40px;font-size:17px;font-weight:700;border-radius:15px;border:none;cursor:pointer;background:linear-gradient(135deg,var(--green),var(--green-d));color:#fff;box-shadow:0 6px 20px rgba(127,168,116,.4);transition:transform .15s,box-shadow .15s;font-family:inherit;}
  .checkin-btn:hover{transform:translateY(-2px);box-shadow:0 8px 26px rgba(127,168,116,.5);}
  .checkin-btn:disabled{background:rgba(127,168,116,.3);cursor:not-allowed;box-shadow:none;transform:none;}
  .streak-display{font-size:14px;color:var(--muted);margin-top:12px;}
  .streak-display .streak-num{font-size:28px;font-weight:800;color:var(--warn);}
  .mood-row{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:14px;}
  .mood-btn{padding:6px 12px;border-radius:10px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);cursor:pointer;font-size:18px;font-family:inherit;transition:all .15s;}
  .mood-btn:hover{background:rgba(255,255,255,.7);}
  .mood-btn.on{background:rgba(127,168,116,.3);border-color:var(--green);}
  .checkin-item{display:flex;gap:12px;padding:8px 0;border-bottom:1px dashed rgba(255,255,255,.5);}
  .checkin-item:last-child{border-bottom:none;}
  .checkin-date{font-size:13px;font-weight:600;color:var(--green-d);min-width:90px;}
  .checkin-mood{font-size:16px;}
  .checkin-note{font-size:13px;color:var(--muted);}

  /* emergency */
  .emer-row{padding:14px;background:rgba(246,222,222,.4);border:1px solid rgba(217,140,140,.3);border-radius:16px;margin-bottom:10px;border-left:4px solid var(--hi);backdrop-filter:blur(8px);}
  .emer-row .er-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
  .emer-row .er-reason{font-weight:700;font-size:15px;}
  .emer-row .er-amt{font-size:18px;font-weight:800;color:var(--hi);}
  .emer-row .er-desc{font-size:13px;color:var(--muted);margin-top:4px;}
  .emer-row .er-date{font-size:12px;color:var(--muted);}

  /* review */
  .review-stat{padding:12px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.6);border-radius:12px;text-align:center;backdrop-filter:blur(6px);}
  .review-stat .r-lbl{font-size:11px;color:var(--muted);}
  .review-stat .r-val{font-size:20px;font-weight:800;color:var(--green-d);margin-top:3px;}
  .week-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .week-tab{padding:7px 14px;border-radius:10px;cursor:pointer;font-size:13px;color:var(--muted);background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.5);transition:all .15s;font-family:inherit;}
  .week-tab:hover{background:rgba(255,255,255,.65);}
  .week-tab.on{background:rgba(127,168,116,.2);border-color:var(--green);color:var(--green-d);font-weight:700;}
  .breakdown{margin-bottom:16px;}
  .bd-row{display:flex;align-items:center;gap:10px;padding:5px 0;}
  .bd-name{font-size:13px;width:90px;flex-shrink:0;}
  .bd-bar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.4);overflow:hidden;}
  .bd-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,var(--green-l),var(--green));}
  .bd-amt{font-size:13px;font-weight:700;width:90px;text-align:right;flex-shrink:0;}

  /* rules & goals */
  .rules-list{list-style:none;padding:0;margin:0;}
  .rules-list li{padding:7px 0;font-size:14px;color:var(--ink);display:flex;align-items:flex-start;gap:8px;border-bottom:1px dashed rgba(255,255,255,.5);}
  .rules-list li:last-child{border-bottom:none;}
  .rules-list .dot{width:6px;height:6px;border-radius:50%;background:var(--green);margin-top:7px;flex-shrink:0;}
  .goal-item{display:flex;align-items:center;gap:10px;padding:7px 0;font-size:14px;border-bottom:1px dashed rgba(255,255,255,.5);cursor:pointer;transition:background .15s,border-radius .15s;}
  .goal-item:last-child{border-bottom:none;}
  .goal-item:hover{background:rgba(255,255,255,.25);border-radius:10px;padding-left:8px;padding-right:8px;margin:0 -8px;}
  .goal-item .gi-chk{width:20px;height:20px;border-radius:7px;border:2px solid var(--green);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:12px;color:#fff;}
  .goal-item.done .gi-chk{background:var(--green);border-color:var(--green);}
  .goal-item.done .gi-text{text-decoration:line-through;color:var(--muted);}
  .rule-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .rule-row .rule-inp{flex:1;}
  .rule-hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;}

  .filter-bar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center;}
  .filter-bar .sel,.filter-bar .inp{flex:0 0 auto;min-width:100px;}

  /* sync */

<script>
/* ============ 数据层 ============ */
const PREFIX='bc:';
const DB={
  get(k,d){try{const v=localStorage.getItem(PREFIX+k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(PREFIX+k,JSON.stringify(v))}catch(e){}}
};
const now=new Date(),CY=now.getFullYear(),CM=now.getMonth(),CD=now.getDate();
const CM_STR=String(CM+1).padStart(2,'0');
const DAYS_IN_MONTH=new Date(CY,CM+1,0).getDate();
const TODAY_STR=`${CY}-${CM_STR}-${String(CD).padStart(2,'0')}`;
const MONTH_STR=`${CY}-${CM_STR}`;

const DEFAULT_CATS=[
  {id:'c1',name:'餐饮',icon:'🍜',budget:540},
  {id:'c2',name:'交通',icon:'🚌',budget:90},
  {id:'c3',name:'日用品',icon:'🧴',budget:120},
  {id:'c4',name:'零食',icon:'🍪',budget:75},
  {id:'c5',name:'其他',icon:'📦',budget:75}
];

const DEFAULT_RULES=[
  '总预算{{budget}}元，覆盖全月生活支出',
  '日均上限 {{dailycap}}/天（剩余 {{remain}} ÷ 剩 {{daysleft}} 天），可滚动累计',
  '超支需在应急登记中说明原因',
  '心愿清单需冷静3天以上方可购买',
  '每日打卡记录消费心得',
  '每周小结 + 月末复盘'
];

const Store={
  settings:()=>DB.get('settings',{totalBudget:900}),
  saveSettings:v=>DB.set('settings',v),
  rules:()=>DB.get('rules',DEFAULT_RULES),
  saveRules:v=>DB.set('rules',v),
  tx:()=>DB.get('tx',[]), saveTx:v=>DB.set('tx',v),
  cats:()=>DB.get('cats',DEFAULT_CATS), saveCats:v=>DB.set('cats',v),
  inv:()=>DB.get('inv',[]), saveInv:v=>DB.set('inv',v),
  wish:()=>DB.get('wish',[]), saveWish:v=>DB.set('wish',v),
  checkins:()=>DB.get('checkins',[]), saveCheckins:v=>DB.set('checkins',v),
  emerg:()=>DB.get('emerg',[]), saveEmerg:v=>DB.set('emerg',v),
  weekly:()=>DB.get('weekly',[]), saveWeekly:v=>DB.set('weekly',v),
  monthly:()=>DB.get('monthly',[]), saveMonthly:v=>DB.set('monthly',v),
  tomb:()=>DB.get('tomb',{}), saveTomb:v=>DB.set('tomb',v),
  goalOverrides:(m='')=>{const all=DB.get('goalOverrides',{});return all[m]||[,,,];},
  saveGoalOverrides:(m,v)=>{const all=DB.get('goalOverrides',{});all[m]=v;DB.set('goalOverrides',all);},
  sync:()=>DB.get('sync',{gistId:'',token:''}), saveSync:v=>DB.set('sync',v),
};

/* ============ 同步层 (GitHub Gist) ============ */
const GIST_FILE='budget-challenge.json';
function gistApi(path,opts,token){
  opts=opts||{};token=token||Store.sync().token;
  return fetch('https://api.github.com'+path,{
    method:opts.method||'GET',
    headers:Object.assign({'Content-Type':'application/json','Accept':'application/vnd.github+json'},token?{'Authorization':'token '+token}:{}),
    body:opts.body?JSON.stringify(opts.body):undefined
  });
}
function collectAll(){
  return{tx:Store.tx(),cats:Store.cats(),inv:Store.inv(),wish:Store.wish(),checkins:Store.checkins(),emerg:Store.emerg(),weekly:Store.weekly(),monthly:Store.monthly(),goalOverrides:DB.get('goalOverrides',{}),rules:Store.rules(),tomb:Store.tomb(),settings:{totalBudget:Store.settings().totalBudget,gistId:Store.sync().gistId,token:''}};
}
function mergeArrById(a,b){const m={};(a||[]).forEach(x=>m[x.id]=x);(b||[]).forEach(x=>{if(m[x.id])m[x.id]=Object.assign({},m[x.id],x);else m[x.id]=x;});return Object.values(m);}
/* 删除时记录墓碑（已删除记录的 id），随同步双向传播，使删除在所有设备生效 */
function addTomb(key,id){const t=Store.tomb();(t[key]=t[key]||[]);if(!t[key].includes(id))t[key].push(id);Store.saveTomb(t);}
function applyRemote(r){
  if(!r)return;
  const localTomb=Store.tomb();
  const remoteTomb=r.tomb||{};
  /* 可删除集合：支持删除传播（墓碑），并保持按 id 合并新增 */
  [['tx',Store.tx,Store.saveTx],['inv',Store.inv,Store.saveInv],['wish',Store.wish,Store.saveWish],['emerg',Store.emerg,Store.saveEmerg]].forEach(([key,get,save])=>{
    if(!r[key])return;
    const tombSet=new Set([...(localTomb[key]||[]),...(remoteTomb[key]||[])]);
    const local=get().filter(it=>!tombSet.has(it.id));
    const have=new Set(local.map(it=>it.id));
    r[key].forEach(it=>{ if(tombSet.has(it.id))return; if(have.has(it.id))return; local.push(it); });
    save(local);
  });
  /* 墓碑双向合并：本机与云端删除都保留 */
  const newTomb={};
  ['tx','inv','wish','emerg'].forEach(key=>{newTomb[key]=Array.from(new Set([...(localTomb[key]||[]),...(remoteTomb[key]||[])]));});
  Store.saveTomb(newTomb);
  if(r.cats)Store.saveCats(mergeArrById(Store.cats(),r.cats));
  if(r.checkins)Store.saveCheckins(mergeArrById(Store.checkins(),r.checkins));
  if(r.weekly)Store.saveWeekly(mergeArrById(Store.weekly(),r.weekly));
  if(r.monthly)Store.saveMonthly(mergeArrById(Store.monthly(),r.monthly));
  if(r.goalOverrides)DB.set('goalOverrides',r.goalOverrides);
  if(r.rules){const local=Store.rules();const merged=[];const maxLen=Math.max(local.length,r.rules.length);for(let i=0;i<maxLen;i++){const lr=local[i],rr=r.rules[i];if(lr!==undefined&&!DEFAULT_RULES.includes(lr))merged.push(lr);else if(rr!==undefined)merged.push(rr);else if(lr!==undefined)merged.push(lr);}Store.saveRules(merged);}
  if(r.settings&&r.settings.totalBudget!=null){const s=Store.settings();s.totalBudget=r.settings.totalBudget;Store.saveSettings(s);}
  if(r.settings&&r.settings.gistId){const syn=Store.sync();syn.gistId=r.settings.gistId;Store.saveSync(syn);}
}
let lastSync={status:'idle',msg:''};
async function testConn(){
  const s=Store.sync();if(!s.token)return{ok:false,msg:'未填写 Token'};
  try{const r=await gistApi('/user');if(r.status===401)return{ok:false,msg:'Token 无效'};if(!r.ok)return{ok:false,msg:'网络错误 '+r.status};return{ok:true,msg:'连接正常'};}
  catch(e){return{ok:false,msg:'无法连接 api.github.com'};}
}
async function doSync(){
  const s=Store.sync();
  if(!s.gistId||!s.token){lastSync={status:'err',msg:'请先填写 Gist ID 与 Token'};render();return;}
  try{
    const get=await gistApi('/gists/'+s.gistId);
    if(get.status===404){
      const mk=await gistApi('/gists',{method:'POST',body:{public:false,files:{[GIST_FILE]:{content:JSON.stringify(collectAll())}}}});
      if(!mk.ok){lastSync={status:'err',msg:'创建失败 '+mk.status};}
      else{const j=await mk.json();const ns=Store.sync();ns.gistId=j.id;Store.saveSync(ns);lastSync={status:'ok',msg:'已创建新 Gist 并同步'};}
      render();return;
    }
    if(!get.ok){lastSync={status:'err',msg:'读取失败 '+get.status};render();return;}
    const j=await get.json();
    const remote=j.files&&j.files[GIST_FILE]?JSON.parse(j.files[GIST_FILE].content||'{}'):{};
    applyRemote(remote);
    const put=await gistApi('/gists/'+s.gistId,{method:'PATCH',body:{files:{[GIST_FILE]:{content:JSON.stringify(collectAll())}}}});
    lastSync=put.ok?{status:'ok',msg:'同步成功 '+new Date().toLocaleTimeString()}:{status:'err',msg:'上传失败 '+put.status};
  }catch(e){lastSync={status:'err',msg:'同步异常：'+(e.message||e)};}
  render();
}
function exportJson(){
  const data=collectAll();const ts=new Date();const p=n=>String(n).padStart(2,'0');
  const fn='bc-backup-'+ts.getFullYear()+p(ts.getMonth()+1)+p(ts.getDate())+'-'+p(ts.getHours())+p(ts.getMinutes())+'.json';
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出 '+fn);
}
function importJson(file){
  const reader=new FileReader();
  reader.onload=()=>{
    let data;try{data=JSON.parse(reader.result);}catch(e){toast('导入失败：文件不是有效 JSON');return;}
    if(!data||typeof data!=='object'){toast('导入失败：格式不正确');return;}
    confirmDialog('导入将覆盖当前所有数据。建议先导出备份，确定导入？',()=>{
      if(data.tx)Store.saveTx(data.tx);if(data.cats)Store.saveCats(data.cats);if(data.inv)Store.saveInv(data.inv);
      if(data.wish)Store.saveWish(data.wish);if(data.checkins)Store.saveCheckins(data.checkins);
      if(data.emerg)Store.saveEmerg(data.emerg);if(data.weekly)Store.saveWeekly(data.weekly);if(data.monthly)Store.saveMonthly(data.monthly);
      if(data.settings&&data.settings.totalBudget!=null){const s=Store.settings();s.totalBudget=data.settings.totalBudget;Store.saveSettings(s);}
      if(data.settings&&data.settings.gistId){const syn=Store.sync();syn.gistId=data.settings.gistId;Store.saveSync(syn);}
      render();toast('导入成功');
    });
  };
  reader.readAsText(file);
}

/* ============ 辅助 ============ */
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function fmtMoney(n){return '¥'+Math.abs(n).toFixed(2);}
function fmtDate(d){const dt=new Date(d);return (dt.getMonth()+1)+'月'+dt.getDate()+'日';}
function thisMonthTx(){return Store.tx().filter(t=>t.date.startsWith(MONTH_STR));}
function monthExpenses(){return thisMonthTx().filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);}
function monthIncome(){return thisMonthTx().filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);}
function catSpent(catId){return thisMonthTx().filter(t=>t.type==='expense'&&t.category===catId).reduce((s,t)=>s+t.amount,0);}
function catName(id){const c=Store.cats().find(c=>c.id===id);return c?c.name:(id||'未分类');}
function catIcon(id){const c=Store.cats().find(c=>c.id===id);return c?c.icon:'📦';}
function isCheckedInToday(){return Store.checkins().some(c=>c.date===TODAY_STR);}
function isWishReady(w){if(w.status!=='cooling')return false;const add=new Date(w.addDate);const end=new Date(add);end.setDate(end.getDate()+w.cooldownDays);return Date.now()>=end.getTime();}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function renderRule(raw,ctx){return esc(raw)
  .replace(/\{\{budget\}\}/g,fmtMoney(ctx.budget))
  .replace(/\{\{dailycap\}\}/g,fmtMoney(ctx.dailycap))
  .replace(/\{\{remain\}\}/g,fmtMoney(ctx.remain))
  .replace(/\{\{daysleft\}\}/g,String(ctx.daysleft))
  .replace(/\{\{days\}\}/g,String(ctx.days));}
function card(title,body,extra){return `<div class="card ${extra||''}">${title?`<div class="card-h">${title}</div>`:''}<div>${body}</div></div>`;}

/* ============ 图标 ============ */

  return '<svg class="ico" width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+(ICONS[name]||'')+'</svg>';

  {id:'dashboard',ic:'home',t:'首页'},

];

function sidebarHTML(){
  let h='';
  NAV.forEach(n=>{
    let dot='';
    if(n.id==='checkin'&&!isCheckedInToday())dot='<span class="nav-dot" style="background:var(--hi)"></span>';
    else if(n.id==='wishlist'){const r=Store.wish().filter(isWishReady).length;if(r>0)dot='<span class="nav-dot" style="background:var(--green)"></span>';}
    h+=`<div class="nav-item ${state.page===n.id?'active':''}" data-act="nav" data-arg="${n.id}"><span class="ic">${icon(n.ic,18)}</span>${n.t}${dot}</div>`;

}

/* ============ 状态 ============ */
const state={page:'dashboard',weekIdx:null,txFilter:{type:'',cat:'',kw:''},selectedMood:''};

/* ============ 页面：首页 ============ */
function pageDashboard(){
  const budget=Store.settings().totalBudget;
  const spent=monthExpenses(),income=monthIncome(),remain=budget+income-spent;
  const dailyBudget=budget/DAYS_IN_MONTH,daysRemain=DAYS_IN_MONTH-CD;
  const expectedSpent=dailyBudget*CD,dailyAvg=CD>0?spent/CD:0;
  const usePct=Math.min(100,spent/budget*100);
  let ringCls='',statusText='正常',statusColor='var(--green)';
  if(remain<0){ringCls='over';statusText='已超支';statusColor='var(--hi)';}
  else if(spent>expectedSpent){ringCls='warn';statusText='超前消费';statusColor='var(--warn)';}
  const recentTx=Store.tx().filter(t=>t.date.startsWith(MONTH_STR)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
  const ov=Store.goalOverrides(MONTH_STR);

/* ============ 页面：打卡区 ============ */
function pageCheckin(){
  const checkins=Store.checkins();
  const monthCheckins=checkins.filter(c=>c.date.startsWith(MONTH_STR));
  const checkedToday=isCheckedInToday();
  let streak=0;
  const sortedDates=[...new Set(checkins.map(c=>c.date))].sort().reverse();
  if(sortedDates.length>0){let checkDate=new Date(TODAY_STR);for(let dd of sortedDates){const dStr=checkDate.toISOString().slice(0,10);if(dd===dStr){streak++;checkDate.setDate(checkDate.getDate()-1);}else break;}}
  const firstDay=new Date(CY,CM,1).getDay();
  let calHtml='';['日','一','二','三','四','五','六'].forEach(d=>calHtml+=`<div class="cal-h">${d}</div>`);
  for(let i=0;i<firstDay;i++)calHtml+='<div class="cal-day empty"></div>';
  for(let d=1;d<=DAYS_IN_MONTH;d++){const dStr=`${CY}-${CM_STR}-${String(d).padStart(2,'0')}`;const checked=checkins.some(c=>c.date===dStr);calHtml+=`<div class="cal-day ${checked?'checked':''} ${d===CD?'today':''}">${d}</div>`;}
  const moods=['😌','💪','😣','😴','🤔','🎉'];

  let html='';
  html+=card('',`<div class="checkin-area"><button class="checkin-btn" data-act="do-checkin" ${checkedToday?'disabled':''}>${checkedToday?'✅ 今日已打卡':'📝 今日打卡'}</button><div class="streak-display">连续打卡 <span class="streak-num">${streak}</span> 天 · 本月已打 ${monthCheckins.length} 天</div>${!checkedToday?`<div class="mood-row"><span class="small muted">心情</span>${moods.map(m=>`<button class="mood-btn ${state.selectedMood===m?'on':''}" data-act="select-mood" data-arg="${m}">${m}</button>`).join('')}</div><div style="margin-top:10px"><input class="inp" id="checkinNote" placeholder="今日消费心得一句话…" style="max-width:360px;margin:0 auto;display:block"></div>`:''}</div>`);
  html+=card(icon('calendar',18)+' '+`${CM+1}月打卡日历`,`<div class="cal-grid">${calHtml}</div>`);
  html+=card(icon('clipboard',18)+' 打卡记录',monthCheckins.length===0?'<div class="empty-tip"><div class="small">暂无打卡记录</div></div>':monthCheckins.sort((a,b)=>b.date.localeCompare(a.date)).map(c=>`<div class="checkin-item"><div class="checkin-date">${fmtDate(c.date)}</div><div class="checkin-mood">${c.mood||''}</div><div class="checkin-note">${esc(c.note||'无备注')}</div></div>`).join(''));
  return html;
}

/* ============ 页面：周小结 ============ */
function pageWeekly(){
  const weeks=[];
  for(let w=0;w*7<DAYS_IN_MONTH;w++){const sd=w*7+1,ed=Math.min((w+1)*7,DAYS_IN_MONTH);weeks.push({idx:w,sd,ed,start:`${CY}-${CM_STR}-${String(sd).padStart(2,'0')}`,end:`${CY}-${CM_STR}-${String(ed).padStart(2,'0')}`,label:`第${w+1}周 (${sd}-${ed}日)`});}
  const currentWeek=Math.floor((CD-1)/7);
  const wIdx=state.weekIdx!=null?state.weekIdx:Math.min(currentWeek,weeks.length-1);
  const w=weeks[wIdx];
  const saved=Store.weekly().filter(r=>r.month===MONTH_STR);
  const existing=saved.find(r=>r.weekIdx===wIdx);
  const txs=Store.tx().filter(t=>t.date>=w.start&&t.date<=w.end+'T23:59:59');
  const exp=txs.filter(t=>t.type==='expense');
  const total=exp.reduce((s,t)=>s+t.amount,0);
  const days=w.ed-w.sd+1,avg=total/days;
  const biggest=exp.length>0?exp.reduce((a,b)=>a.amount>b.amount?a:b):null;
  const checkinDays=Store.checkins().filter(c=>c.date>=w.start&&c.date<=w.end+'T23:59:59').length;
  const catMap={};exp.forEach(t=>{catMap[t.category]=(catMap[t.category]||0)+t.amount;});
  const catBd=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const maxCat=catBd.length>0?catBd[0][1]:1;

  let html='';
  html+=`<div class="week-tabs">${weeks.map(wk=>`<button class="week-tab ${wk.idx===wIdx?'on':''}" data-act="switch-week" data-arg="${wk.idx}">${wk.label}</button>`).join('')}</div>`;
  html+=card(icon('chart',18)+' '+w.label+' 数据',`<div class="grid4">
    <div class="review-stat"><div class="r-lbl">周总支出</div><div class="r-val">${fmtMoney(total)}</div></div>
    <div class="review-stat"><div class="r-lbl">日均支出</div><div class="r-val">${fmtMoney(avg)}</div></div>
    <div class="review-stat"><div class="r-lbl">打卡天数</div><div class="r-val">${checkinDays}/${days}</div></div>
    <div class="review-stat"><div class="r-lbl">最大单笔</div><div class="r-val">${biggest?fmtMoney(biggest.amount):'—'}</div></div>
  </div>${catBd.length>0?`<div class="breakdown" style="margin-top:14px"><div class="small muted" style="margin-bottom:6px">分类支出明细</div>${catBd.map(([cid,amt])=>`<div class="bd-row"><span class="bd-name">${catIcon(cid)} ${catName(cid)}</span><div class="bd-bar"><i style="width:${amt/maxCat*100}%"></i></div><span class="bd-amt">${fmtMoney(amt)}</span></div>`).join('')}</div>`:''}`);
  html+=card(icon('note',18)+' 周小结内容',`
    <div class="field"><label>本周亮点（哪些做得好）</label><textarea class="tar" id="wkHighlight" placeholder="比如：有3天控制在15元以内…">${existing?esc(existing.highlight):''}</textarea></div>
    <div class="field"><label>本周不足（哪里超支了）</label><textarea class="tar" id="wkProblem" placeholder="比如：周末聚餐花了50元…">${existing?esc(existing.problem):''}</textarea></div>
    <div class="field"><label>下周计划</label><textarea class="tar" id="wkPlan" placeholder="比如：每天带饭、零食预算砍半…">${existing?esc(existing.plan):''}</textarea></div>
    <button class="btn" data-act="save-weekly" data-arg="${wIdx}">${existing?'更新小结':'保存小结'}</button>`);
  if(saved.length>0){
    html+=card(icon('archive',18)+' 已保存的周小结',saved.sort((a,b)=>b.weekIdx-a.weekIdx).map(r=>{const wk=weeks[r.weekIdx];return `<div class="checkin-item" style="cursor:pointer" data-act="switch-week" data-arg="${r.weekIdx}"><div class="checkin-date">${wk?wk.label:'第'+(r.weekIdx+1)+'周'}</div><div class="checkin-note">${r.highlight?esc(r.highlight.slice(0,50)):'无亮点记录'}…</div></div>`;}).join(''));
  }
  return html;
}

  const saved=Store.monthly();
  const existing=saved.find(r=>r.month===MONTH_STR);
  const txs=thisMonthTx(),exp=txs.filter(t=>t.type==='expense');
  const totalExp=exp.reduce((s,t)=>s+t.amount,0);
  const totalInc=txs.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const budget=Store.settings().totalBudget,remain=budget-totalExp;
  const dailyAvg=totalExp/CD;
  const checkinDays=Store.checkins().filter(c=>c.date.startsWith(MONTH_STR)).length;
  const emergList=Store.emerg().filter(e=>e.date.startsWith(MONTH_STR));
  const catMap={};exp.forEach(t=>{catMap[t.category]=(catMap[t.category]||0)+t.amount;});
  const catBd=Object.entries(catMap).sort((a,b)=>b[1]-a[1]);
  const maxCat=catBd.length>0?catBd[0][1]:1;
  const weeklyCount=Store.weekly().filter(r=>r.month===MONTH_STR).length;

  let html='';
  html+=card(icon('chart',18)+' 月度数据总览',`<div class="grid4">
    <div class="review-stat"><div class="r-lbl">总预算</div><div class="r-val">${fmtMoney(budget)}</div></div>
    <div class="review-stat"><div class="r-lbl">实际支出</div><div class="r-val" style="color:var(--hi)">${fmtMoney(totalExp)}</div></div>
    <div class="review-stat"><div class="r-lbl">${remain>=0?'剩余':'超支'}</div><div class="r-val" style="color:${remain>=0?'var(--green)':'var(--hi)'}">${fmtMoney(remain)}</div></div>
    <div class="review-stat"><div class="r-lbl">日均支出</div><div class="r-val">${fmtMoney(dailyAvg)}</div></div>
    <div class="review-stat"><div class="r-lbl">额外收入</div><div class="r-val" style="color:var(--green)">${fmtMoney(totalInc)}</div></div>
    <div class="review-stat"><div class="r-lbl">打卡天数</div><div class="r-val">${checkinDays}/${CD}</div></div>
    <div class="review-stat"><div class="r-lbl">应急支出</div><div class="r-val" style="color:var(--warn)">${emergList.length}次 ${fmtMoney(emergList.reduce((s,e)=>s+e.amount,0))}</div></div>
    <div class="review-stat"><div class="r-lbl">周小结</div><div class="r-val">${weeklyCount}/4</div></div>
  </div>${catBd.length>0?`<div class="breakdown" style="margin-top:14px"><div class="small muted" style="margin-bottom:6px">分类支出排行</div>${catBd.map(([cid,amt],i)=>`<div class="bd-row"><span class="bd-name">${i+1}. ${catIcon(cid)} ${catName(cid)}</span><div class="bd-bar"><i style="width:${amt/maxCat*100}%"></i></div><span class="bd-amt">${fmtMoney(amt)} (${(amt/totalExp*100).toFixed(0)}%)</span></div>`).join('')}</div>`:''}`);
  html+=card(icon('note',18)+' 月度复盘内容',`
    <div class="field"><label>月度总结（一句话概括这个月）</label><textarea class="tar" id="moSummary" placeholder="比如：总体控制在预算内…">${existing?esc(existing.summary):''}</textarea></div>
    <div class="field"><label>超支分析（哪些地方花多了）</label><textarea class="tar" id="moOverspend" placeholder="分析超支的类别和原因…">${existing?esc(existing.overspend):''}</textarea></div>
    <div class="field"><label>经验教训（学到了什么）</label><textarea class="tar" id="moLessons" placeholder="比如：提前备餐能省很多…">${existing?esc(existing.lessons):''}</textarea></div>
    <div class="field"><label>下月计划（下月怎么改进）</label><textarea class="tar" id="moNextPlan" placeholder="下月的预算分配和策略调整…">${existing?esc(existing.nextPlan):''}</textarea></div>
    <button class="btn" data-act="save-monthly">${existing?'更新复盘':'保存复盘'}</button>`);
  if(saved.length>0){
    html+=card(icon('archive',18)+' 历史月度复盘',saved.sort((a,b)=>b.month.localeCompare(a.month)).map(r=>`<div class="checkin-item"><div class="checkin-date">${r.month.slice(0,4)}年${parseInt(r.month.slice(5))}月</div><div class="checkin-note">${r.summary?esc(r.summary.slice(0,60)):'无总结'}…</div></div>`).join(''));
  }
  return html;
}

/* ============ 页面：同步设置 ============ */
function pageSync(){
  const s=Store.sync();
  let html='';
  html+=card(icon('sync',18)+' GitHub Gist 同步',`
    <div class="sync-status ${lastSync.status==='err'?'err':''}" id="syncMsg">${lastSync.msg||'尚未同步'}</div>
    <div class="field"><label>Gist ID（所有设备填同一个）</label><input class="inp" id="gistId" value="${esc(s.gistId)}" placeholder="留空则首次同步时自动创建"></div>
    <div class="field"><label>Token（classic，仅 gist 权限）</label><input class="inp" id="token" type="password" value="${esc(s.token)}" placeholder="ghp_..."></div>
    <div class="row">
      <button class="btn" data-act="save-sync">保存设置</button>
      <button class="btn ghost" data-act="test-conn">测试连接</button>
      <button class="btn sm" data-act="do-sync">立即同步</button>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn sm ghost" data-act="export-json">导出 JSON 备份</button>
      <button class="btn sm ghost" data-act="import-json">导入 JSON 备份</button>
    </div>
    <div class="small muted" style="margin-top:10px">Gist ID 须与手机端一致；Token 仅存本地浏览器。导出文件可存电脑/云盘作为本地备份。</div>`);
  const txCount=Store.tx().length,catCount=Store.cats().length,invCount=Store.inv().length,wishCount=Store.wish().length;
  const checkinCount=Store.checkins().length,emerCount=Store.emerg().length,weeklyCount=Store.weekly().length,monthlyCount=Store.monthly().length;
  html+=card(icon('chart',18)+' 数据统计',`
    <div class="kv"><span>消费记录</span><b>${txCount}</b></div>
    <div class="kv"><span>分类数量</span><b>${catCount}</b></div>
    <div class="kv"><span>物资条目</span><b>${invCount}</b></div>
    <div class="kv"><span>心愿清单</span><b>${wishCount}</b></div>
    <div class="kv"><span>打卡记录</span><b>${checkinCount}</b></div>
    <div class="kv"><span>应急记录</span><b>${emerCount}</b></div>
    <div class="kv"><span>周小结</span><b>${weeklyCount}</b></div>
    <div class="kv"><span>月度复盘</span><b>${monthlyCount}</b></div>`);
  return html;
}

/* ============ Toast & 确认弹窗 ============ */
function toast(msg){
  let w=document.getElementById('toastWrap');
  if(!w){w=document.createElement('div');w.id='toastWrap';w.className='toast-wrap';document.body.appendChild(w);}
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  w.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),300);},2200);
}
function confirmDialog(msg,onYes){
  let mask=document.getElementById('modalMask');
  if(!mask){mask=document.createElement('div');mask.id='modalMask';mask.className='modal-mask';document.body.appendChild(mask);}
  mask.innerHTML=`<div class="modal"><div class="m-msg">${esc(msg)}</div><div class="m-btns"><button class="m-no" type="button">取消</button><button class="m-yes" type="button">确认</button></div></div>`;
  mask.classList.add('show');
  const close=()=>mask.classList.remove('show');
  mask.querySelector('.m-no').onclick=close;
  mask.querySelector('.m-yes').onclick=()=>{close();onYes();};
  mask.onclick=e=>{if(e.target===mask)close();};
}
function openRulesEditor(){
  let mask=document.getElementById('rulesModal');
  if(!mask){
    mask=document.createElement('div');mask.id='rulesModal';mask.className='modal-mask';
    mask.innerHTML=`<div class="modal" style="width:min(92vw,440px);text-align:left">
      <div style="font-weight:700;font-size:16px;margin-bottom:2px">编辑挑战规则</div>
      <div class="small muted" style="margin-bottom:10px;line-height:1.5">逐条编辑，可增删。支持占位符：<br>{{budget}} 总预算 · {{dailycap}} 日均上限 · {{remain}} 剩余金额 · {{daysleft}} 剩余天数 · {{days}} 当月天数</div>
      <div id="rulesList"></div>
      <button class="btn sm ghost" data-act="add-rule" style="margin:4px 0 12px">＋ 添加一条</button>
      <div class="m-btns"><button class="m-no" data-act="close-rules">取消</button><button class="m-yes" data-act="save-rules">保存</button></div>
    </div>`;
    document.body.appendChild(mask);
    mask.addEventListener('click',e=>{if(e.target===mask)closeRulesModal();});
  }
  const list=mask.querySelector('#rulesList');list.innerHTML=Store.rules().map(r=>`<div class="rule-row"><input class="inp rule-inp" value="${esc(r)}" placeholder="输入一条规则…"><button class="btn sm danger" data-act="del-rule">删除</button></div>`).join('');
  mask.classList.add('show');
}
function closeRulesModal(){const m=document.getElementById('rulesModal');if(m)m.classList.remove('show');}

/* ============ 侧栏预算进度 ============ */
function renderSidebarProgress(){
  const spent=monthExpenses(),budget=Store.settings().totalBudget;
  const pct=Math.min(100,spent/budget*100),remain=budget-spent;
  const el=document.getElementById('budgetMini');
  if(el)el.innerHTML=`<div class="bm-lbl">预算 ${pct.toFixed(0)}%</div><div class="bm-bar"><i style="width:${pct}%"></i></div><div class="bm-row"><span style="color:var(--hi)">${fmtMoney(spent)}</span><span style="color:${remain>=0?'var(--green)':'var(--hi)'}">${remain>=0?fmtMoney(remain):'超支'}</span></div>`;
  const sub=document.getElementById('brandSub');
  if(sub)sub.textContent=`${CY}年${CM+1}月`;
}

/* ============ 主渲染 ============ */
function render(){
  document.getElementById('nav').innerHTML=sidebarHTML();
  document.getElementById('topTitle').textContent=PAGE_TITLE[state.page]||'';
  const w=['日','一','二','三','四','五','六'];
  document.getElementById('topDate').textContent=TODAY_STR+' 星期'+w[now.getDay()];
  const dot=document.getElementById('syncDot');
  dot.className='sync-dot'+(lastSync.status==='ok'?' ok':lastSync.status==='err'?' err':'');
  let c='';
  if(state.page==='dashboard')c=pageDashboard();
  else if(state.page==='transactions')c=pageTransactions();
  else if(state.page==='inventory')c=pageInventory();
  else if(state.page==='wishlist')c=pageWishlist();
  else if(state.page==='checkin')c=pageCheckin();
  else if(state.page==='emergency')c=pageEmergency();
  else if(state.page==='weekly')c=pageWeekly();
  else if(state.page==='monthly')c=pageMonthly();
  else if(state.page==='sync')c=pageSync();
  document.getElementById('content').innerHTML=c;
  renderSidebarProgress();
  if(state.page==='transactions')renderTxList();
}

/* ============ 事件 ============ */
const H={
  'open-sidebar':()=>{document.getElementById('sidebar').classList.add('open');document.getElementById('overlay').classList.add('show');},
  'close-sidebar':()=>{document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');},
  'nav':(arg)=>{state.page=arg;state.weekIdx=null;document.getElementById('sidebar').classList.remove('open');document.getElementById('overlay').classList.remove('show');render();window.scrollTo(0,0);},
  'add-tx':()=>{const tx={id:uid(),type:document.getElementById('txType').value,date:document.getElementById('txDate').value,category:document.getElementById('txCat').value.trim()||'未分类',amount:parseFloat(document.getElementById('txAmount').value),note:document.getElementById('txNote').value.trim()};if(!tx.amount||tx.amount<=0){toast('请输入金额');return;}const l=Store.tx();l.push(tx);Store.saveTx(l);document.getElementById('txAmount').value='';document.getElementById('txNote').value='';toast('记录已添加');renderTxList();renderSidebarProgress();},
  'del-tx':(arg)=>{Store.saveTx(Store.tx().filter(t=>t.id!==arg));addTomb('tx',arg);toast('已删除');renderTxList();renderSidebarProgress();},
  'add-inv':()=>{const name=document.getElementById('invName').value.trim();if(!name){toast('请填写名称');return;}const item={id:uid(),name,qty:parseInt(document.getElementById('invQty').value)||1,unit:document.getElementById('invUnit').value,category:document.getElementById('invCat').value,note:document.getElementById('invNote').value.trim()};const l=Store.inv();l.push(item);Store.saveInv(l);toast('物资已登记');render();},
  'inv-adjust':(arg)=>{const[id,delta]=arg.split('|');const l=Store.inv();const item=l.find(i=>i.id===id);if(item){item.qty=Math.max(0,item.qty+parseInt(delta));Store.saveInv(l);render();}},
  'del-inv':(arg)=>{Store.saveInv(Store.inv().filter(i=>i.id!==arg));addTomb('inv',arg);toast('已删除');render();},
  'add-wish':()=>{const name=document.getElementById('wishName').value.trim();if(!name){toast('请填写物品名称');return;}const item={id:uid(),name,price:parseFloat(document.getElementById('wishPrice').value)||0,cooldownDays:parseInt(document.getElementById('wishDays').value)||3,reason:document.getElementById('wishReason').value.trim(),addDate:TODAY_STR,status:'cooling'};const l=Store.wish();l.push(item);Store.saveWish(l);toast('已加入冷静清单');render();},
  'wish-bought':(arg)=>{const l=Store.wish();const item=l.find(w=>w.id===arg);if(item){item.status='bought';Store.saveWish(l);const txs=Store.tx();txs.push({id:uid(),type:'expense',date:TODAY_STR,category:'其他',amount:item.price,note:'购买：'+item.name});Store.saveTx(txs);toast('已标记购买，自动记入消费');render();renderSidebarProgress();}},
  'del-wish':(arg)=>{Store.saveWish(Store.wish().filter(w=>w.id!==arg));addTomb('wish',arg);toast('已删除');render();},
  'do-checkin':()=>{if(isCheckedInToday())return;const noteEl=document.getElementById('checkinNote');const note=noteEl?noteEl.value.trim():'';const l=Store.checkins();l.push({id:uid(),date:TODAY_STR,note,mood:state.selectedMood});Store.saveCheckins(l);state.selectedMood='';toast('打卡成功！');render();},
  'select-mood':(arg,t)=>{state.selectedMood=arg;document.querySelectorAll('.mood-btn').forEach(b=>b.classList.remove('on'));t.classList.add('on');},
  'add-emer':()=>{const reason=document.getElementById('emergReason').value.trim();if(!reason){toast('请填写原因');return;}const item={id:uid(),date:document.getElementById('emergDate').value,amount:parseFloat(document.getElementById('emergAmount').value)||0,reason,desc:document.getElementById('emergDesc').value.trim()};const l=Store.emerg();l.push(item);Store.saveEmerg(l);toast('应急支出已登记');render();},
  'del-emer':(arg)=>{Store.saveEmerg(Store.emerg().filter(e=>e.id!==arg));addTomb('emerg',arg);toast('已删除');render();},
  'toggle-goal':(arg)=>{const idx=parseInt(arg,10);const ov=Store.goalOverrides(MONTH_STR);ov[idx]=!ov[idx];Store.saveGoalOverrides(MONTH_STR,ov);render();},
  'switch-week':(arg)=>{state.weekIdx=parseInt(arg);render();},
  'save-weekly':(arg)=>{const wIdx=parseInt(arg);const reviews=Store.weekly();const idx=reviews.findIndex(r=>r.month===MONTH_STR&&r.weekIdx===wIdx);const data={month:MONTH_STR,weekIdx:wIdx,highlight:document.getElementById('wkHighlight').value.trim(),problem:document.getElementById('wkProblem').value.trim(),plan:document.getElementById('wkPlan').value.trim()};if(idx>=0)reviews[idx]=data;else reviews.push(data);Store.saveWeekly(reviews);toast('周小结已保存');render();},
  'save-monthly':()=>{const reviews=Store.monthly();const idx=reviews.findIndex(r=>r.month===MONTH_STR);const data={month:MONTH_STR,summary:document.getElementById('moSummary').value.trim(),overspend:document.getElementById('moOverspend').value.trim(),lessons:document.getElementById('moLessons').value.trim(),nextPlan:document.getElementById('moNextPlan').value.trim()};if(idx>=0)reviews[idx]=data;else reviews.push(data);Store.saveMonthly(reviews);toast('月度复盘已保存');render();},
  'save-sync':()=>{const s=Store.sync();s.gistId=document.getElementById('gistId').value.trim();s.token=document.getElementById('token').value.trim();Store.saveSync(s);lastSync={status:'ok',msg:'设置已保存，可点立即同步'};render();},
  'test-conn':async()=>{lastSync={status:'idle',msg:'连接测试中…'};render();const r=await testConn();lastSync=r.ok?{status:'ok',msg:r.msg}:{status:'err',msg:r.msg};render();},
  'do-sync':()=>{doSync();},
  'export-json':()=>exportJson(),
  'import-json':()=>{const f=document.createElement('input');f.type='file';f.accept='application/json,.json';f.onclick=()=>{};f.onchange=()=>{if(f.files&&f.files[0])importJson(f.files[0]);};f.click();},
  'edit-rules':()=>openRulesEditor(),
  'add-rule':()=>{const wrap=document.querySelector('#rulesModal #rulesList');const d=document.createElement('div');d.className='rule-row';d.innerHTML=`<input class="inp rule-inp" placeholder="输入一条规则…"><button class="btn sm danger" data-act="del-rule">删除</button>`;wrap.appendChild(d);},
  'del-rule':(arg,t)=>{const row=t.closest('.rule-row');if(row)row.remove();},
  'close-rules':()=>closeRulesModal(),
  'save-rules':()=>{const ids=[...document.querySelectorAll('#rulesModal .rule-inp')].map(i=>i.value.trim()).filter(Boolean);Store.saveRules(ids);closeRulesModal();toast('规则已保存');render();},
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t)return;
  const act=t.dataset.act,arg=t.dataset.arg;
  if(H[act]){e.preventDefault();H[act](arg,t);}
});
document.addEventListener('input',e=>{
  const t=e.target.closest('[data-chg]');
  if(!t)return;
  const chg=t.dataset.chg;
  if(chg==='tx-type')state.txFilter.type=t.value;
  else if(chg==='tx-cat')state.txFilter.cat=t.value;
  else if(chg==='tx-kw')state.txFilter.kw=t.value;
  renderTxList();
});

render();
</script>
</body>
</html>
